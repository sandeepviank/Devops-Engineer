name: Multiple Triggers Demo
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  trigger-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Print trigger message
        run: |
          echo "Workflow executed."
          echo "Triggered by: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"