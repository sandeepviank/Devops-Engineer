name: Multiple Jobs Demo

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Build application
        run: echo "Building application"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Test application
        run: echo "Testing application"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy application
        run: echo "Deploying application"